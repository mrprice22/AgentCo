# AgentCo roadmap — the single source of truth for planned work.
#
# Schema: the engine's work model (docs/agentco-core-engine-design.md §4) in the
# NWN roadmap.yaml tradition (stable ids, groups, notes/impl_notes, date+commit
# on shipped items). The console's Backlog board and Portfolio Kanban read this
# file directly until the engine is live; build phase 0 then imports it into the
# engine's event log as seed events (see feat-p0-seed-import) and the engine
# becomes the system of record. Validate with:  python bin/roadmap-lint.py
#
# Item fields
#   id                 required  lowercase-hyphen, unique, stable (deep link: /#item-<id>)
#   kind               required  epic | feature | story | task | decision
#   title              required  <= 100 chars (same cap as NWN, kept for thread/card names)
#   product            required  products[].id
#   group              required  groups[].id (navigator / board grouping)
#   state              required  see meta.states for the kind
#   owner_role         required  human | bootstrap (human + Claude Code) | an AgentCo role
#   nature             epic/feature/story/task: business | enabler
#   parent             feature -> epic, story -> feature, task -> story; decisions may name any item
#   phase              optional  meta.phases[].id
#   description        optional  plain text
#   acceptance_criteria  story/task: required once state is past draft
#   wsjf               epic/feature unless done/cancelled: business_value, time_criticality,
#                      risk_reduction, job_size (Fibonacci; engine §7.2 computes the score)
#   size_points        optional (story/task)
#   depends_on         optional  list of item ids
#   source             required on open items: where the to-do was raised ("<doc> §N" or conversation)
#   notes              optional  human-facing summary
#   impl_notes         optional  internal notes
#   question, options, recommended, resolution   decisions (question required)
#   date, commit       done items (date required)
#
# WSJF inputs and sizes below are initial estimates written during migration;
# re-score them in PI planning.

meta:
  schema_version: 1
  updated: "2026-09-27"
  work_model: "docs/agentco-core-engine-design.md §4"
  states:
    epic: [funnel, reviewing, analyzing, ready, implementing, done, cancelled]
    work: [draft, needs_refinement, ready, in_progress, in_review, in_test, awaiting_human, blocked, done, cancelled]
    decision: [draft, awaiting_human, done, cancelled]
  board_lanes: [draft, needs_refinement, ready, in_progress, in_review, in_test, awaiting_human, blocked, done]
  portfolio_lanes: [funnel, reviewing, analyzing, ready, implementing, done]
  phases:
    - { id: design,    title: "Design baseline" }
    - { id: p0,        title: "Build phase 0 — simulation core" }
    - { id: p1,        title: "Build phase 1 — one real worker" }
    - { id: p2,        title: "Build phase 2 — the team" }
    - { id: p3,        title: "Build phase 3 — the top" }
    - { id: p4,        title: "Build phase 4 — governance enforced" }
    - { id: p5,        title: "Build phase 5 — scale" }
    - { id: console-a, title: "Console phase A — trusted core (human + Claude Code)" }
    - { id: console-b, title: "Console phase B — handoff as Product 0" }
    - { id: console-c, title: "Console phase C — company-driven" }
    - { id: later,     title: "Beyond v0.1 scope" }
  phase_notes: >-
    Phase order follows docs/agentco-core-engine-design.md §17 with one change made
    during migration: egress controls (data-class ceilings, secret scanning) move
    from phase 4 to phase 2, because phase 2 introduces the first remote tier
    and governance design §5 requires them before any remote dispatch.

products:
  - id: agentco
    title: "AgentCo platform"
    kind: system
    owner: human
    notes: >-
      Designed and bootstrapped by the human with Claude Code. Changes to it are
      system changes (change/config design §1).
  - id: console
    title: "AgentCo Console"
    kind: internal
    owner: human
    notes: >-
      Product 0 (console design §8). Built by the human through phase A, then
      owned and improved by AgentCo within its capacity share.

groups:
  - { id: design-docs,  title: "Design documents",       order: 10 }
  - { id: decisions,    title: "Owner decisions",        order: 20 }
  - { id: prompts,      title: "Agent prompts",          order: 30 }
  - { id: evals,        title: "Evals & benchmarks",     order: 40 }
  - { id: engine,       title: "Core engine",            order: 50 }
  - { id: driver,       title: "Driver & routing",       order: 60 }
  - { id: governance,   title: "Governance & compliance",order: 70 }
  - { id: operations,   title: "Operations & continuity",order: 80 }
  - { id: console-core, title: "Console — trusted core", order: 90 }
  - { id: console-ui,   title: "Console — presentation", order: 100 }
  - { id: future,       title: "Future scope",           order: 110 }

