  - id: dec-repo-visibility
    kind: decision
    product: agentco
    group: decisions
    state: done
    owner_role: human
    title: "Repository visibility and what the public docs disclose"
    question: >-
      The docs name the LAN inference address, say it is unauthenticated,
      describe the host hardware, and reference homerslotr.com and the NWN
      repo; the commit author email is public. How should that be handled?
    options:
      - { id: a, label: "Make the repository private" }
      - { id: b, label: "Stay public; replace addresses, hardware, and NWN references with placeholders" }
      - { id: c, label: "Stay public as is" }
    recommended: a
    notes: "The docs describe current security gaps openly; private costs nothing while the design is in flux."
    resolution: >-
      Private (option a). The owner switches the GitHub setting (story-repo-private).
    date: "2026-09-27"
    source: ["initial repo review 2026-09-27", "conversation 2026-09-27 (push summary)"]

  - id: dec-sandbox-mechanism
    kind: decision
    product: agentco
    group: decisions
    phase: p1
    state: done
    owner_role: human
    title: "Sandbox mechanism for agent processes"
    question: "What isolates each agent sandbox on the Windows host?"
    options:
      - { id: a, label: "One OS process per sandbox, own working dir, message-bus-only I/O" }
      - { id: b, label: "Containers (Docker Desktop / WSL2)" }
      - { id: c, label: "Separate Python interpreters in one process tree" }
    recommended: a
    notes: "The data layer design fixes the contract, not the mechanism. (a) is enough for phase 1; revisit before untrusted code execution."
    resolution: >-
      Each agent runs in a sandbox whose only interface is the role-scoped Agent API, with ACLs generated from the RACI matrix (docs/agentco-agent-api-policy-design.md). v1 mechanism: one OS process per sandbox (option a).
    date: "2026-09-27"
    source: ["docs/agentco-data-layer-design.md §10"]

  - id: dec-notification-channel
    kind: decision
    product: agentco
    group: decisions
    phase: p3
    state: done
    owner_role: human
    title: "Notification channel that reaches the owner away from the PC"
    question: "Which channel carries operational alerts (SLA-1/SLA-2)?"
    options:
      - { id: a, label: "Self-hosted push service (e.g. ntfy)" }
      - { id: b, label: "Private Discord channel via webhook (reuses existing Discord tooling)" }
      - { id: c, label: "Email" }
    recommended: a
    notes: "Alerts carry counts and states only. Desktop toast alone does not meet SLA-1."
    resolution: >-
      Push notifications to the owner's phone, mirrored as an alert with its action in the driver/console UI. Notifications link to the action; they never perform it.
    date: "2026-09-27"
    source: ["docs/agentco-service-management-design.md §18", "docs/agentco-monitor-driver-design.md §13"]

  - id: dec-session-mechanism
    kind: decision
    product: console
    group: decisions
    phase: console-a
    state: done
    owner_role: human
    title: "Console authentication mechanism"
    question: "How do console sessions authenticate, locally and remotely?"
    options:
      - { id: a, label: "Password + session cookie (roadmap_auth.py pattern); add WebAuthn before remote access" }
      - { id: b, label: "WebAuthn / Windows Hello from the start" }
      - { id: c, label: "Password + session cookie only" }
    recommended: a
    resolution: >-
      Admin-role credential sign-in, the NWN roadmap_auth.py pattern, including remote access through the tunnel. Re-auth for high-impact verbs still applies.
    date: "2026-09-27"
    source: ["docs/agentco-monitor-driver-design.md §13", "docs/agentco-console-design.md §4"]

  - id: dec-offsite-backup
    kind: decision
    product: agentco
    group: decisions
    phase: p4
    state: draft
    owner_role: human
    title: "Offsite backup destination and encryption key custody"
    question: "Where do encrypted offsite backups go, and where is the key kept?"
    options:
      - { id: a, label: "Rotated external drive stored offsite; key in a password manager" }
      - { id: b, label: "Cloud object storage (supplier decision); key held offline" }
    depends_on: [story-eval-spacetimedb]
    notes: "Owner is considering SpacetimeDB (2026-09-27); decide after the evaluation spike."
    source: ["docs/agentco-service-management-design.md §8.2", "docs/agentco-service-management-design.md §18"]

  - id: dec-data-at-rest
    kind: decision
    product: agentco
    group: decisions
    phase: p4
    state: done
    owner_role: human
    title: "Data-at-rest encryption for the stores"
    question: "Is OS-level disk encryption enough for the SQLite stores (800-53 SC-28)?"
    options:
      - { id: a, label: "OS disk encryption only" }
      - { id: b, label: "Per-store encryption (e.g. SQLCipher)" }
      - { id: c, label: "Both" }
    recommended: a
    notes: "Check what this Windows 11 Home host supports: full BitLocker management is a Pro feature; Home offers Device Encryption on supported hardware."
    resolution: >-
      Owner had no preference. Host check: volume unencrypted and Secure Boot off, so Device
      Encryption is unavailable as configured. Application-level encryption: SQLCipher stores
      and encrypted file blobs, key in Windows Credential Manager (DPAPI). Secure Boot + Device
      Encryption stays optional (story-optional-secure-boot).
    date: "2026-09-27"
    source: ["docs/agentco-governance-policy.md §15"]

