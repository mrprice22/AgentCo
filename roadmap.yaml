  - id: dec-ceo-role
    kind: decision
    product: agentco
    group: decisions
    phase: design
    state: awaiting_human
    owner_role: human
    title: "Who is the CEO, and who is the owner's first point of contact?"
    question: >-
      The to-do says the CEO is always the first interface to the human and signs
      off on every hire and fire. Today the Executive Director is the top role and
      Client Communications is the only voice to the owner (directive D12).
      How should the CEO fit?
    options:
      - { id: a, label: "The Executive Director is the CEO; Client Comms stays the single voice, speaking for the CEO" }
      - { id: b, label: "The Executive Director is the CEO and becomes the owner's first contact; Client Comms drafts and frames" }
      - { id: c, label: "Add a new CEO role above the Executive Director" }
    recommended: a
    notes: "Option a changes titles only. Options b and c change D12 and the escalation design's goal 3, and are system changes."
    source: ["docs/to-do.pdf p.4 (CEO is always the first interface to the human controller; CEO signs off on hires and fires)"]

