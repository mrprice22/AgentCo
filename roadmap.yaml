  - id: story-proof-threads
    kind: story
    nature: enabler
    parent: feat-proof-doc
    product: agentco
    group: foundations
    phase: design
    state: in_progress
    owner_role: bootstrap
    title: "Thread interactions: collision, composition, assimilation, fusion; learning as a strong collision"
    depends_on: [story-proof-axioms]
    size_points: 3
    acceptance_criteria:
      - "Mark and deflection are defined against the counterfactual run in which the threads never met"
      - "The four outcomes and their thread-count changes are stated, with the coupling condition marked conjecture (C8)"
