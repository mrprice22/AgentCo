# FOUNDATIONS — Proof of Us, written first (owner to-do 2026-09-29)
# Working draft: docs/proof-of-us.md. Item ids keep the original "title-proof"
# names so existing deep links stay valid.
# ════════════════════════════════════════════════════════════════════════════

  - id: epic-title-proof
    kind: epic
    nature: enabler
    product: agentco
    group: foundations
    phase: design
    state: implementing
    owner_role: bootstrap
    title: "Proof of Us: the threshold of consciousness, with AgentCo as its first application"
    description: >-
      The owner's starred to-do: write the proof first. Proof of Us asks at
      what complexity any system (human, animal, collective, or artificial)
      can become conscious, and how conscious beings ("threads") combine and
      change each other. AgentCo is its first application: why a company of
      agents works, and why a team and community are stronger than any single
      agent. Every design principle and directive rule should trace back to
      it. Design set v1.0 depends on this epic, so build phase 0 waits for it
      too.
    notes: >-
      Owner decisions 2026-09-29 to 2026-10-01: the definition is not
      access-only (the target is the threshold for phenomenal consciousness);
      the bridge axiom is functionalist (substrate-independent); the scope
      covers all forms of consciousness; threads combine and every interaction
      changes both; learning is a strong collision; need-to-know (D6) takes
      precedence over global broadcast.
    wsjf: { business_value: 13, time_criticality: 20, risk_reduction: 13, job_size: 8 }
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)", "conversation 2026-09-29 to 2026-10-01"]

  - id: feat-proof-research
    kind: feature
    nature: enabler
    parent: epic-title-proof
    product: agentco
    group: foundations
    phase: design
    state: in_progress
    owner_role: bootstrap
    title: "Research notes behind Proof of Us"
    wsjf: { business_value: 8, time_criticality: 13, risk_reduction: 5, job_size: 3 }
    description: "One note per theme, each ending with what it contributes to the proof: an axiom, a claim, an analogy, or nothing."
    notes: "Drafted in docs/proof-of-us.md §1 (v0.4); owner review in progress."
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)"]

  - id: story-proof-consciousness
    kind: story
    nature: enabler
    parent: feat-proof-research
    product: agentco
    group: foundations
    phase: design
    state: in_review
    owner_role: bootstrap
    title: "Notes: Neville Goddard's law of consciousness and law of reverse effort"
    acceptance_criteria:
      - "Goddard's claims are cited from his books and split into a usable part and an excluded part"
      - "Reverse effort is traced to Coué and Huxley and translated into a claim"
      - "The note ends with what it contributes (E0, A2, C5)"
    notes: >-
      docs/proof-of-us.md §1.1–1.2. Goddard's narrow claim (experience is the
      one thing given directly) becomes axiom E0; the law of assumption becomes
      the state axiom A2; reverse effort becomes claim C5. Video: "STOP TRYING
      with Neville Goddard" (Akira The Don), https://www.youtube.com/watch?v=ifRuo5fZ4N0
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)"]

  - id: story-proof-language
    kind: story
    nature: enabler
    parent: feat-proof-research
    product: agentco
    group: foundations
    phase: design
    state: in_review
    owner_role: bootstrap
    title: "Notes: language as consciousness, tokens as activated thoughts, numbers as language"
    acceptance_criteria:
      - "Each to-do line is paired with its rigorous counterpart and a status"
      - "The note ends with what it contributes"
    notes: >-
      docs/proof-of-us.md §1.3. To-do lines: "every language is a consciousness,
      thoughts/actions are the words (tokens) activated"; "numbers of sufficient
      size become a language" (Gödel numbering, Kleene recursion theorem →
      lemma L2); "power of conscious attention, like a laser beam" (Attention
      Schema Theory → condition N4).
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)"]

  - id: story-proof-computation
    kind: story
    nature: enabler
    parent: feat-proof-research
    product: agentco
    group: foundations
    phase: design
    state: in_review
    owner_role: bootstrap
    title: "Notes: Wolfram's ruliad and A New Kind of Science; LLMs as time machines"
    acceptance_criteria:
      - "Wolfram's observer theory and computational equivalence are summarized with sources"
      - "The time-machine line is stated as a provable claim, with its limits"
      - "The note ends with what it contributes"
    notes: >-
      docs/proof-of-us.md §1.4. Observers are bounded and persistent (A3, N3);
      Rule 110 universality shows universal computation isn't the threshold
      (L4); "LLMs are time machines" becomes claim C3 (every output has
      nonzero probability under untruncated sampling).
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)"]

  - id: story-proof-culture
    kind: story
    nature: enabler
    parent: feat-proof-research
    product: agentco
    group: foundations
    phase: design
    state: in_review
    owner_role: bootstrap
    title: "Notes: stories, music, symbols, and the past as inputs to the proof"
    acceptance_criteria:
      - "Each to-do item is identified and marked as axiom, claim, analogy, or nothing"
      - "Warbreaker's Breath and Heightening model is mapped to threads and thresholds"
    notes: >-
      docs/proof-of-us.md §1.5–1.6. Warbreaker ("colors of war") is the model
      for counting threads: Breath counts, Heightenings as thresholds,
      sentience at ~1,000 Breaths plus a Command, Breath transfer as
      assimilation. Film confirmed: Limitless (2011). "Wishing to change the
      past is self harm" becomes axiom A5. Old Soul (MALO) and Ferry Corsten's
      Blueprint go to the music list (epic-agent-life).
    source: ["docs/to-do.pdf p.1 (owner to-do 2026-09-29)"]

